name: Sync V17.6 footers

on:
  push:
    paths:
      - '.github/workflows/sync-v17-6.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update legal-page footers
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '<footer class="footer"><div class="container footer-grid"><div class="brand footer-brand"><img src="assets/logo.png" alt="TALUS Logo"><span>Energieberatung rund um den Bodensee</span></div><p>Bodensee · Hegau · Oberschwaben</p><div class="footer-links"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></div></div></footer>'
          new = '<footer class="footer"><div class="container footer-grid"><div class="brand footer-brand"><img src="assets/logo.png" alt="TALUS Logo"><span>Energieberatung rund um den Bodensee</span></div><div class="footer-links"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></div></div></footer>'
          for name in ('impressum.html','datenschutz.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Footer not found in {name}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit V17.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add impressum.html datenschutz.html
          git commit -m "Sync V17.6 footers"
          git push
