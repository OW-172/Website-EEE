name: Fix V17.5 privacy sync

on:
  push:
    paths:
      - '.github/workflows/fix-v17-5-privacy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact local V17.5 wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('datenschutz.html')
          s = p.read_text(encoding='utf-8')
          old = 'verarbeiten wir Ihre Daten auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO.'
          new = 'verarbeiten wir Ihre Daten auf Grundlage des Art. 6 Abs. 1 lit. b DSGVO.'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datenschutz.html
          git diff --cached --quiet || git commit -m 'Sync V17.5: exact privacy content'
          git push
