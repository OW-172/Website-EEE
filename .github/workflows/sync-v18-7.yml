name: Sync V18.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v18-7.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V18.7 changes
        shell: python
        run: |
          from pathlib import Path

          # Remove external Google Fonts from all pages.
          block = '''  <link rel="preconnect" href="https://fonts.googleapis.com">\n  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">\n'''
          for filename in ('index.html','impressum.html','datenschutz.html'):
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s = s.replace(block, '')
              p.write_text(s, encoding='utf-8')

          # Current form rules from V18.7.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<label>PLZ / Ort<input type="text" name="ort" autocomplete="postal-code" maxlength="120"></label>', '<label>PLZ und/oder Ort<input type="text" name="ort" autocomplete="postal-code" minlength="5" maxlength="120" required></label>')
          s = s.replace('<label>Nachricht<textarea name="nachricht" rows="5" maxlength="4000" placeholder="Kurz zum Gebäude und Vorhaben …"></textarea></label>', '<label>Nachricht<textarea name="nachricht" rows="5" minlength="10" maxlength="4000" required placeholder="Kurz zum Gebäude und Vorhaben …"></textarea></label>')
          p.write_text(s, encoding='utf-8')

          # Local system-font stack + current responsive navigation rules.
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('body{margin:0;font-family:Inter,system-ui,sans-serif;', 'body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;')
          s = s.replace('h1,h2,h3{font-family:Manrope,Inter,sans-serif;', 'h1,h2,h3{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;')
          s = s.replace('font-family:Manrope,Inter,sans-serif;', 'font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;')
          s = s.replace('@media(max-width:900px){.container{width:min(100% - 32px,1420px)}.nav-toggle{display:block}.nav{display:none;position:absolute;top:112px;left:0;right:0;background:#fff;padding:18px 24px;flex-direction:column;align-items:flex-start;border-bottom:1px solid var(--line)}.nav.open{display:flex}', '@media(max-width:900px){.container{width:min(100% - 32px,1420px)}.nav-toggle{display:block}.nav{display:none;position:absolute;top:112px;left:0;right:0;background:#fff;padding:18px 24px;flex-direction:column;align-items:flex-end;text-align:right;border-bottom:1px solid var(--line)}.nav.open{display:flex}')
          marker = '/* V18.4 – Hauptnavigation vor Überschneidung kompakter */'
          if marker not in s:
              s = s.rstrip() + '''\n\n/* V18.4 – Hauptnavigation vor Überschneidung kompakter */\n@media (max-width:1500px) and (min-width:1151px){\n  .nav-wrap{\n    gap:18px;\n  }\n  .brand{\n    gap:14px;\n    flex:0 0 auto;\n  }\n  .brand img{\n    width:125px;\n    height:78px;\n  }\n  .brand-copy strong{\n    font-size:1.12rem;\n  }\n  .brand-copy small{\n    font-size:.98rem;\n  }\n  .nav{\n    gap:22px;\n    font-size:.92rem;\n    white-space:nowrap;\n  }\n  .nav a{\n    white-space:nowrap;\n  }\n}\n'''
          p.write_text(s, encoding='utf-8')
      - name: Commit V18.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css impressum.html datenschutz.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Sync website to V18.7"
            git push
          fi
# trigger
